<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect x="4" y="4" width="56" height="56" rx="14" ry="14" fill="#1e293b"/>
  <!-- Connecting string between the two tin cans -->
  <path d="M 22 42 Q 32 55 42 26" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left tin can (tilted) -->
  <g transform="translate(19,32) rotate(-28)">
    <rect x="-8" y="-11" width="16" height="22" rx="2" fill="#94a3b8" stroke="#e2e8f0" stroke-width="1.5"/>
    <line x1="-8" y1="-4" x2="8" y2="-4" stroke="#64748b" stroke-width="1.2"/>
    <line x1="-8" y1="3" x2="8" y2="3" stroke="#64748b" stroke-width="1.2"/>
    <ellipse cx="0" cy="-11" rx="8" ry="3.2" fill="#334155" stroke="#e2e8f0" stroke-width="1.5"/>
    <ellipse cx="0" cy="11" rx="8" ry="2.8" fill="#cbd5e1" stroke="#e2e8f0" stroke-width="1.2"/>
  </g>
  <!-- Right tin can (tilted opposite) -->
  <g transform="translate(45,22) rotate(145)">
    <rect x="-8" y="-11" width="16" height="22" rx="2" fill="#38bdf8" stroke="#e0f2fe" stroke-width="1.5"/>
    <line x1="-8" y1="-4" x2="8" y2="-4" stroke="#0284c7" stroke-width="1.2"/>
    <line x1="-8" y1="3" x2="8" y2="3" stroke="#0284c7" stroke-width="1.2"/>
    <ellipse cx="0" cy="-11" rx="8" ry="3.2" fill="#0f172a" stroke="#e0f2fe" stroke-width="1.5"/>
    <ellipse cx="0" cy="11" rx="8" ry="2.8" fill="#7dd3fc" stroke="#e0f2fe" stroke-width="1.2"/>
  </g>
</svg>
