name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            appstream \
            build-essential \
            ca-certificates \
            ccache \
            cmake \
            curl \
            desktop-file-utils \
            git \
            libasound2-dev \
            libopus-dev \
            libpulse-dev \
            libqt6sql6-sqlite \
            libspeexdsp-dev \
            libsrtp2-dev \
            libssl-dev \
            ninja-build \
            pkg-config \
            python3-pip \
            qt6-base-dev \
            qt6-l10n-tools \
            qt6-svg-dev \
            qt6-tools-dev \
            qtkeychain-qt6-dev \
            uuid-dev \
            xvfb
          pip install --break-system-packages lizard

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache pjproject installation
        uses: actions/cache@v4
        with:
          path: third_party/pjproject/install
          key: pjproject-2.17-trixie-${{ hashFiles('tools/build-pjproject.sh') }}

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-trixie-${{ github.sha }}
          restore-keys: ccache-trixie-

      - name: Build pinned pjproject
        run: tools/build-pjproject.sh

      - name: Configure Tincan
        run: >
          cmake -G Ninja -B build -DTINCAN_WERROR=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build Tincan
        run: cmake --build build

      - name: ccache statistics
        run: ccache --show-stats

      - name: Run unit, UI and e2e tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build -j2 --output-on-failure

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            build/Testing/Temporary/
          if-no-files-found: ignore

      - name: Run code size check
        run: tools/size-check.sh
