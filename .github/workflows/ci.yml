name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    # Debian 13 ships Qt 6.8; Ubuntu 24.04 ships Qt 6.4, the oldest Qt
    # Tincan supports.
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: trixie
            image: debian:trixie
          - distro: noble
            image: ubuntu:24.04
    name: build-and-test (${{ matrix.distro }})
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
          DISTRO: ${{ matrix.distro }}
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            appstream \
            build-essential \
            ca-certificates \
            ccache \
            cmake \
            curl \
            desktop-file-utils \
            git \
            libasound2-dev \
            libopus-dev \
            libpulse-dev \
            libqt6sql6-sqlite \
            libspeexdsp-dev \
            libsrtp2-dev \
            libssl-dev \
            ninja-build \
            pkg-config \
            python3-pip \
            qt6-base-dev \
            qt6-l10n-tools \
            qt6-svg-dev \
            qt6-tools-dev \
            qtkeychain-qt6-dev \
            uuid-dev \
            xvfb
          if [ "${DISTRO}" = trixie ]; then
            pip install --break-system-packages lizard==1.26.1
          fi

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # These caches only speed up CI. GitHub scopes caches written by
      # pull_request runs to the PR's merge ref, and release.yml restores no
      # caches at all: it rebuilds pjproject from the SHA-256-verified tarball.
      - name: Cache pjproject installation
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: third_party/pjproject/install
          key: pjproject-2.17-${{ matrix.distro }}-${{ hashFiles('tools/build-pjproject.sh') }}

      - name: Cache ccache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .ccache
          key: ccache-${{ matrix.distro }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.distro }}-

      - name: Build pinned pjproject
        run: tools/build-pjproject.sh

      - name: Configure Tincan
        run: >
          cmake -G Ninja -B build -DTINCAN_WERROR=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build Tincan
        run: cmake --build build

      - name: ccache statistics
        run: ccache --show-stats

      - name: Run unit, UI and e2e tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build -j2 --output-on-failure

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-logs-${{ matrix.distro }}
          path: |
            build/Testing/Temporary/
          if-no-files-found: ignore

      - name: Run code size check
        if: matrix.distro == 'trixie'
        run: tools/size-check.sh
