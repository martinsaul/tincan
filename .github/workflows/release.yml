# Copyright (C) 2026 Tincan contributors
#
# Publishes a GitHub Release for every v* tag: two .debs, the AppImage,
# SHA256SUMS and the matching CHANGELOG.md section as release notes.
#
#   tincan_<ver>_amd64.deb              Debian 13 (trixie), Qt 6.8
#   tincan_<ver>_ubuntu24.04_amd64.deb  Ubuntu 24.04 / Linux Mint 22, Qt 6.4
#   Tincan-<ver>-x86_64.AppImage        any distribution with glibc >= 2.39
#
# Each package is built in a container of the distribution it targets, and
# each .deb is installed and started in that container before upload. The
# AppImage is built on Ubuntu 24.04, the oldest supported toolchain, because
# it runs only on hosts whose glibc is at least as new as the build
# machine's. linuxdeploy runs in the container with APPIMAGE_EXTRACT_AND_RUN=1
# (no FUSE).

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_DEPS: >-
    build-essential ca-certificates cmake curl dpkg-dev file git
    libasound2-dev libopus-dev libpulse-dev libqt6sql6-sqlite libspeexdsp-dev
    libsrtp2-dev libssl-dev ninja-build pkg-config qt6-base-dev
    qt6-base-dev-tools qt6-l10n-tools qt6-svg-dev qt6-tools-dev qt6-wayland
    qtkeychain-qt6-dev uuid-dev
  # Debian ships the SVG plugins separately; Ubuntu 24.04 has them in
  # libqt6svg6, which qt6-svg-dev pulls in.
  TRIXIE_DEPS: qt6-svg-plugins

jobs:
  deb:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ${BUILD_DEPS} ${TRIXIE_DEPS}

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check that the tag matches the project version
        run: |
          version="$(sed -n 's/^ *VERSION \([0-9.]*\)$/\1/p' CMakeLists.txt | head -n1)"
          test "v${version}" = "${GITHUB_REF_NAME}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match project version ${version}" >&2
            exit 1
          }

      - name: Build pinned pjproject
        run: tools/build-pjproject.sh

      - name: Build Release
        run: |
          cmake -G Ninja -B build-rel -DCMAKE_BUILD_TYPE=Release -DTINCAN_BUILD_TESTS=OFF
          cmake --build build-rel

      - name: Package .deb
        run: |
          cd build-rel
          cpack -G DEB
          dpkg-deb -I ./*.deb
          dpkg-deb -c ./*.deb

      - name: Install and start the .deb
        env:
          DEBIAN_FRONTEND: noninteractive
          QT_QPA_PLATFORM: offscreen
        run: |
          apt-get install -y ./build-rel/*.deb
          tincan --version

      - name: Upload .deb
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deb
          path: build-rel/*.deb
          if-no-files-found: error

  deb-ubuntu-noble:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
    steps:
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ${BUILD_DEPS}

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check that the tag matches the project version
        run: |
          version="$(sed -n 's/^ *VERSION \([0-9.]*\)$/\1/p' CMakeLists.txt | head -n1)"
          test "v${version}" = "${GITHUB_REF_NAME}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match project version ${version}" >&2
            exit 1
          }

      - name: Build pinned pjproject
        run: tools/build-pjproject.sh

      - name: Build Release
        run: |
          cmake -G Ninja -B build-rel -DCMAKE_BUILD_TYPE=Release -DTINCAN_BUILD_TESTS=OFF
          cmake --build build-rel

      - name: Package .deb
        run: |
          cd build-rel
          cpack -G DEB
          dpkg-deb -I ./*.deb
          dpkg-deb -c ./*.deb

      - name: Install and start the .deb
        env:
          DEBIAN_FRONTEND: noninteractive
          QT_QPA_PLATFORM: offscreen
        run: |
          apt-get install -y ./build-rel/*.deb
          tincan --version

      - name: Upload .deb
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deb-ubuntu-noble
          path: build-rel/*.deb
          if-no-files-found: error

  appimage:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
    steps:
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ${BUILD_DEPS}

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Build pinned pjproject
        run: tools/build-pjproject.sh

      - name: Build AppImage
        env:
          TINCAN_APPIMAGE_OUTPUT_DIR: ${{ github.workspace }}/dist
        run: packaging/appimage/build-appimage.sh

      - name: Upload AppImage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: appimage
          path: dist/*.AppImage
          if-no-files-found: error

  publish:
    needs: [deb, deb-ubuntu-noble, appimage]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Download packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- *.deb *.AppImage > SHA256SUMS
          cat SHA256SUMS

      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v hdr="## [${version}]" '
            index($0, hdr) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]*\]: / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no section for ${version}" >&2
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Tincan ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            dist/*.deb dist/*.AppImage dist/SHA256SUMS
